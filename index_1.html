:root{--bg:#0C0C0F;--sf:#141418;--sf2:#1C1C22;--gold:#C9A84C;--g2:#E8C97A;--tx:#F0EDE8;--tx2:#9B9890;--tx3:#5A5856;--red:#E24B4A;--grn:#1D9E75;--blu:#378ADD;--bd:#2A2A32}

#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .6s}

.slogo{font-size:clamp(1.8rem,7vw,3rem);font-weight:900;letter-spacing:0;color:var(--gold)}
.ssub{color:var(--tx3);font-size:.75rem;letter-spacing:3px;text-transform:uppercase;margin-top:.4rem}
#screen{min-height:100vh}
.hidden{display:none!important}
/* AUTH */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.auth-box{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:2rem;width:100%;max-width:400px}
.auth-logo{font-size:clamp(1.8rem,7vw,2.4rem);font-weight:900;letter-spacing:0;color:var(--gold);text-align:center;margin-bottom:.2rem}
.auth-tag{text-align:center;color:var(--tx3);font-size:.7rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:.85rem}
.lang-bar{display:flex;justify-content:center;margin-bottom:1.25rem}
.lang-wrap{display:flex;gap:4px;background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:3px}
.lbtn{padding:.35rem .9rem;border:none;border-radius:5px;font-size:.82rem;font-weight:700;cursor:pointer;transition:.15s;letter-spacing:.5px}
.lbtn.on{background:var(--gold);color:#0C0C0F}
.lbtn.off{background:transparent;color:var(--tx2)}
.auth-title{font-size:1.1rem;font-weight:600;text-align:center;margin-bottom:1.25rem}
.fld{margin-bottom:.9rem}
.fld label{display:block;font-size:.68rem;color:var(--tx2);letter-spacing:.5px;margin-bottom:.35rem;text-transform:uppercase}
.fld input,.fld select{width:100%;background:var(--sf2);border:1px solid var(--bd);border-radius:9px;padding:.7rem .9rem;color:var(--tx);font-size:.95rem;outline:none;-webkit-appearance:none;transition:.2s}
.fld input:focus,.fld select:focus{border-color:var(--gold)}
.fld select option{background:var(--sf2)}
.btn-gold{width:100%;padding:.85rem;background:var(--gold);border:none;border-radius:10px;color:#0C0C0F;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:.75rem;transition:.2s}
.btn-gold:active{background:var(--g2)}
.auth-sw{text-align:center;font-size:.85rem;color:var(--tx2);margin-bottom:.75rem}
.auth-sw span{color:var(--gold);cursor:pointer;text-decoration:underline}
.auth-div{text-align:center;color:var(--tx3);font-size:.78rem;margin:.65rem 0;position:relative}
.auth-div::before,.auth-div::after{content:'';position:absolute;top:50%;width:40%;height:1px;background:var(--bd)}
.auth-div::before{left:0}.auth-div::after{right:0}
.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.dbtn{padding:.75rem;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;text-align:center;border:none;transition:.2s}
.dbtn.admin{background:rgba(201,168,76,.15);border:2px solid var(--gold);color:var(--gold)}
.dbtn.other{background:var(--sf2);border:1px solid var(--bd);color:var(--tx2)}
.trial-box{background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.2);border-radius:8px;padding:.65rem;font-size:.78rem;color:var(--gold);text-align:center;margin-bottom:1rem}
.err-box{background:rgba(226,75,74,.1);border:1px solid rgba(226,75,74,.3);border-radius:8px;padding:.65rem .85rem;font-size:.82rem;color:#f08080;margin-bottom:.85rem;display:none}
.err-box.show{display:block}
/* DISCLAIMER */
.disc-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.disc-box{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:2rem;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.disc-box h2{font-size:1.6rem;font-weight:900;color:var(--red);text-align:center;margin-bottom:.5rem}
.disc-box h3{font-size:.88rem;font-weight:600;color:var(--gold);margin:1rem 0 .35rem}
.disc-box p,.disc-box li{font-size:.82rem;color:var(--tx2);line-height:1.7}
.disc-box ul{padding-left:1.2rem;margin-bottom:.5rem}
.disc-accept{display:flex;align-items:flex-start;gap:.75rem;background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:1rem;margin-top:1.25rem;cursor:pointer;transition:.2s}
.disc-accept.checked{border-color:var(--gold)}
.disc-accept input{margin-top:3px;flex-shrink:0;accent-color:var(--gold)}
.disc-accept span{font-size:.82rem;line-height:1.5}

.app-layout{display:flex;min-height:100vh}
.sidebar{width:225px;background:var(--sf);border-right:1px solid var(--bd);position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:100;transition:transform .3s;overflow-y:auto}
.sb-logo{padding:1.25rem 1.25rem 1.25rem 1rem;border-bottom:1px solid var(--bd)}
.sb-logo h1{font-size:1.4rem;font-weight:900;letter-spacing:1px;color:var(--gold);line-height:1.1;white-space:nowrap}
.sb-logo p{font-size:.62rem;color:var(--tx3);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}
.sb-user{padding:.7rem 1.25rem;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--bd)}
.sb-av{width:32px;height:32px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.72rem;color:#0C0C0F;flex-shrink:0}
.sb-info p{font-size:.82rem;font-weight:500}
.sb-info span{font-size:.68rem;color:var(--gold);text-transform:uppercase;letter-spacing:.5px}
.sb-nav{flex:1;padding:.5rem 0;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:9px;padding:.6rem 1.25rem;cursor:pointer;font-size:.85rem;color:var(--tx2);border-left:3px solid transparent;transition:.15s;user-select:none}
.nav-item:hover{background:var(--sf2);color:var(--tx)}
.nav-item.active{background:var(--sf2);color:var(--gold);border-left-color:var(--gold)}
.sb-bottom{padding:.75rem 1.25rem;border-top:1px solid var(--bd)}
.app-lang{display:flex;gap:3px;background:var(--sf2);border-radius:7px;padding:3px;margin-bottom:.6rem}
.alb{flex:1;padding:.3rem;border:none;background:transparent;color:var(--tx2);cursor:pointer;border-radius:5px;font-size:.75rem;font-weight:700;transition:.15s;letter-spacing:.5px}
.alb.on{background:var(--gold);color:#0C0C0F}
.logout-btn{width:100%;padding:.5rem;background:transparent;border:1px solid var(--bd);border-radius:8px;color:var(--tx2);font-size:.82rem;cursor:pointer;transition:.2s}
.logout-btn:hover{border-color:var(--red);color:var(--red)}
.main-content{margin-left:225px;padding:1.75rem;min-height:100vh}
.page{display:none}.page.active{display:block}
.hamburger{display:none;position:fixed;top:.75rem;left:.75rem;z-index:200;background:var(--sf);border:1px solid var(--bd);border-radius:9px;padding:.55rem .65rem;cursor:pointer;color:var(--tx);font-size:1.1rem;line-height:1}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90}
.overlay.show{display:block}
/* CARDS & COMPONENTS */
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:1.25rem}
.ph h2{font-size:1.8rem;font-weight:900;letter-spacing:2px;margin-bottom:.15rem}
.ph p{color:var(--tx2);font-size:.85rem;margin-bottom:1.5rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.85rem}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.65rem}
.stat{background:var(--sf2);border-radius:9px;padding:.75rem 1rem}
.stat label{font-size:.6rem;color:var(--tx3);letter-spacing:.5px;text-transform:uppercase;display:block;margin-bottom:.25rem}

.stat .s{font-size:.72rem;color:var(--tx2);margin-top:.15rem}
.btn{padding:.55rem 1.1rem;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;border:none;transition:.2s}
.btn.p{background:var(--gold);color:#0C0C0F}.btn.p:active{background:var(--g2)}
.btn.s{background:transparent;border:1px solid var(--bd);color:var(--tx2)}.btn.s:hover{border-color:var(--gold);color:var(--gold)}
.btn.d{background:transparent;border:1px solid var(--red);color:var(--red)}

.nb.green{background:rgba(29,158,117,.07);border:1px solid rgba(29,158,117,.2);color:#4ac99b}

.pb{height:100%;border-radius:20px;transition:.6s}
.pb-lbl{display:flex;justify-content:space-between;font-size:.78rem;color:var(--tx2);margin-bottom:.2rem}

.client-row:last-child{border-bottom:none}

.tp-s{background:rgba(55,138,221,.15);color:var(--blu);border:1px solid rgba(55,138,221,.3)}
.tp-d{background:rgba(91,88,86,.15);color:var(--tx2);border:1px solid var(--bd)}

.rb{background:rgba(55,138,221,.15);color:var(--blu);border:1px solid rgba(55,138,221,.3)}
.gb{background:rgba(201,168,76,.15);color:var(--gold);border:1px solid rgba(201,168,76,.3)}
.xb{background:rgba(91,88,86,.15);color:var(--tx2);border:1px solid var(--bd)}
.phrase-card{background:linear-gradient(135deg,#0f0d00,#1c1800);border:1px solid rgba(201,168,76,.4);border-radius:14px;padding:1.5rem;margin-bottom:1rem}
.course-card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;overflow:hidden;cursor:pointer;transition:.2s}
.course-card:hover{border-color:var(--gold)}
.ct{height:85px;background:linear-gradient(135deg,#0f0d00,#1c1800);display:flex;align-items:center;justify-content:center;font-size:2.5rem}
.wknav{display:flex;align-items:center;gap:.75rem;margin-bottom:1rem}
.wkbtn{background:var(--sf2);border:1px solid var(--bd);border-radius:7px;padding:.4rem .75rem;color:var(--tx2);cursor:pointer;font-size:.82rem;transition:.15s}
.wkbtn:hover{border-color:var(--gold);color:var(--gold)}
.day-row{display:grid;grid-template-columns:48px 1fr;gap:.65rem;margin-bottom:.5rem;align-items:start}
.dlbl{font-size:.72rem;color:var(--tx2);padding-top:.35rem;text-align:right}
.dlbl.today{color:var(--gold);font-weight:700}
.sess-block{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:.85rem}
.edit-btn{background:transparent;border:1px solid var(--bd);border-radius:5px;padding:.2rem .5rem;color:var(--tx3);font-size:.68rem;cursor:pointer;transition:.15s}
.edit-btn:hover{border-color:var(--gold);color:var(--gold)}
.stitle{font-size:1rem;font-weight:700;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;margin:1.25rem 0 .75rem;padding-bottom:.4rem;border-bottom:1px solid var(--bd)}
.stitle:first-child{margin-top:0}
.acc-chip{padding:.2rem .6rem;border-radius:20px;font-size:.7rem;cursor:pointer;border:1px solid var(--bd);background:transparent;color:var(--tx3);transition:.15s}
.acc-chip.on{background:rgba(201,168,76,.12);border-color:var(--gold);color:var(--gold)}
.tabs{display:flex;gap:3px;background:var(--sf2);padding:3px;border-radius:9px;margin-bottom:1.25rem;flex-wrap:wrap;width:fit-content}
.tab{padding:.42rem 1rem;border:none;background:transparent;color:var(--tx2);cursor:pointer;border-radius:7px;font-size:.82rem;transition:.15s}
.tab.active{background:var(--sf);color:var(--tx)}
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--sf);border:1px solid var(--gold);border-radius:10px;padding:.7rem 1.25rem;color:var(--tx);font-size:.85rem;z-index:9999;opacity:0;transform:translateY(16px);transition:.3s;pointer-events:none;max-width:260px;text-align:center}
.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main-content{margin-left:0;padding:1rem;padding-top:4rem}
  .hamburger{display:flex;align-items:center}
  .g2,.g3{grid-template-columns:1fr}
  .g4{grid-template-columns:1fr 1fr}
  .day-row{grid-template-columns:42px 1fr}
}
@media(min-width:769px){.sidebar{transform:translateX(0)}}
</style>

function ini(n) { return (n||'?').split(' ').map(function(w){return w[0];}).join('').toUpperCase().slice(0,2); }

  ['en','es'].forEach(function(l){
    var a = document.getElementById('auth-lang-'+l);
    var b = document.getElementById('app-lang-'+l);
    if(a) a.className = 'lbtn ' + (l===lang?'on':'off');
    if(b) b.className = 'alb ' + (l===lang?'on':'off');
  });
  // Auth screen text IDs
  var textMap = {
    'lang-tagline':'tagline',
    'lang-signtitle':'signin',
    'lang-emaillbl':'email',
    'lang-passlbl':'password',
    'lang-signinbtn':'signinbtn',
    'lang-regtitle':'register',
    'lang-trialline':'trialfree',
    'lang-namelbl':'fullname',
    'lang-iamlbl':'iama',
    'lang-optathlete':'athlete',
    'lang-optcoach':'coachopt',
    'lang-termstext':'trialfree',
    'lang-regbtn':'regbtn',
    'lang-demodiv':'ortrydemo',
    'lang-disc-enter':'discEnter',
    'lang-disc-accept':'discAccept',
    'lang-disc-title':'discTitle'
  };
  Object.keys(textMap).forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.textContent = t(textMap[id]);
  });
  // HTML content with links
  var newhere = document.getElementById('lang-newhere');
  if(newhere) newhere.innerHTML = t('newhere') + ' <span onclick="showReg()">' + t('startfree') + '</span>';
  var havacct = document.getElementById('lang-havacct');
  if(havacct) havacct.innerHTML = t('alreadyhave') + ' <span onclick="showLogin()">' + t('signinlink') + '</span>';
  // Logout button
  var lo = document.getElementById('lang-logout');
  if(lo) lo.textContent = t('signout');
  // Rebuild nav if logged in
  if(PROFILE) buildNav(PROFILE.role);
  // Re-render current page
  if(PAGE && PROFILE) renderPage(PAGE);
  toast(lang==='es'?'Idioma: Espanol':'Language: English');
}

function showErr(m) {
  var e = document.getElementById('auth-err');
  if(!e) return;
  e.textContent = m; e.className = 'err-box show';
  setTimeout(function(){ e.className = 'err-box'; }, 4000);
}

function showLogin() {
  var fl = document.getElementById('form-login');
  var fr = document.getElementById('form-reg');
  if(fl) fl.style.display = '';
  if(fr) fr.style.display = 'none';
}

function showReg() {
  var fl = document.getElementById('form-login');
  var fr = document.getElementById('form-reg');
  if(fl) fl.style.display = 'none';
  if(fr) fr.style.display = '';
}

async function doLogin() {
  var email = document.getElementById('l-email').value.trim();
  var pass = document.getElementById('l-pass').value;
  if(!email||!pass){ showErr('Please fill in all fields'); return; }
  var btn = document.getElementById('lang-signinbtn');
  btn.disabled = true; btn.textContent = '...';
  try {
    var res = await SB.auth.signInWithPassword({email:email, password:pass});
    if(res.error) { showErr(res.error.message); }
  } catch(e) { showErr('Login failed. Please try again.'); }
  btn.disabled = false; btn.textContent = t('signinbtn');
}

async function doRegister() {
  var name = document.getElementById('r-name').value.trim();
  var email = document.getElementById('r-email').value.trim();
  var pass = document.getElementById('r-pass').value;
  var role = document.getElementById('r-role').value;
  if(!name||!email||!pass){ showErr('Please fill in all fields'); return; }
  var btn = document.getElementById('lang-regbtn');
  btn.disabled = true; btn.textContent = '...';
  try {
    var res = await SB.auth.signUp({email:email, password:pass, options:{data:{full_name:name, role:role}}});
    if(res.error) { showErr(res.error.message); }
    else {
      toast('Welcome to FinisherFlow!');
      await SB.auth.signInWithPassword({email:email, password:pass});
    }
  } catch(e) { showErr('Registration failed. Please try again.'); }
  btn.disabled = false; btn.textContent = t('regbtn');
}


// ── PROFILE HELPERS ────────────────────────────────────────────────────────
function getDisplayName() {
  if(!PROFILE) return 'User';
  return PROFILE.full_name || PROFILE.name || PROFILE.email || 'User';
}

function getInitials() {
  var name = getDisplayName();
  return name.split(' ').map(function(w){return w[0]||'';}).join('').toUpperCase().slice(0,2) || 'FF';
}

function getRoleLabel() {
  if(!PROFILE) return '';
  var perms = PROFILE.permissions || [PROFILE.role];
  var isAdmin = perms.indexOf('admin') >= 0;
  var isCoach = perms.indexOf('coach') >= 0;
  var specs = PROFILE.specializations || [];
  if(isAdmin && isCoach) return (LANG==='es'?'Admin + ':'' + '') + (specs[0] || 'Coach');
  if(isAdmin) return LANG==='es'?'Administrador/a':'Administrator';
  if(specs[0]) return specs[0];
  return LANG==='es'?'Coach':'Coach';
}

function getRoleSwitcher() {
  if(!PROFILE) return '';
  var perms = PROFILE.permissions || [PROFILE.role];
  var isAdmin = perms.indexOf('admin') >= 0;
  var isCoach = perms.indexOf('coach') >= 0;
  if(!isAdmin || !isCoach) return '';
  // Has both roles - show switcher
  var currentlyViewingAdmin = PROFILE.role === 'admin';
  if(currentlyViewingAdmin) {
    return '<div style="padding:.5rem 1rem;border-bottom:1px solid var(--bd)">' +
      '<button onclick="switchToCoachView()" style="width:100%;padding:.4rem;border-radius:6px;border:1px solid rgba(201,168,76,.3);background:rgba(201,168,76,.06);color:var(--gold);font-family:inherit;font-size:.72rem;font-weight:600;cursor:pointer">' +
      '🏋 ' + (LANG==='es'?'Vista Coach':'Coach View') + '</button></div>';
  } else {
    return '<div style="padding:.5rem 1rem;border-bottom:1px solid var(--bd)">' +
      '<button onclick="switchToAdminView()" style="width:100%;padding:.4rem;border-radius:6px;border:1px solid rgba(201,168,76,.3);background:rgba(201,168,76,.06);color:var(--gold);font-family:inherit;font-size:.72rem;font-weight:600;cursor:pointer">' +
      '⚙️ ' + (LANG==='es'?'Vista Admin':'Admin View') + '</button></div>';
  }
}

function switchToCoachView() {
  // Keep all profile data but change navigation to coach view
  var savedRole = PROFILE.role;
  PROFILE._savedRole = savedRole;
  PROFILE.role = 'coach';
  showApp();
  goTo('home');
}

function switchToAdminView() {
  PROFILE.role = PROFILE._savedRole || 'admin';
  showApp();
  goTo('home');
}

function hasPermission(perm) {
  if(!PROFILE) return false;
  var perms = PROFILE.permissions || [PROFILE.role];
  return perms.indexOf(perm) >= 0 || perms.indexOf('admin') >= 0;
}

async function loadProfile() {
  try {
    var res = await SB.from('profiles').select('*').eq('id', USER.id).single();
    if(res.data) { PROFILE = res.data; return; }
    var meta = USER.user_metadata || {};
    var p = {id:USER.id, full_name:meta.full_name||USER.email, name:meta.full_name||USER.email, email:USER.email, role:meta.role||'client'};
    await SB.from('profiles').upsert(p);
    PROFILE = p;
  } catch(e) {
    var meta = USER.user_metadata || {};
    PROFILE = {id:USER.id, full_name:meta.full_name||USER.email, name:meta.full_name||USER.email, email:USER.email, role:meta.role||'client'};
  }
}

// ── NAVIGATION ─────────────────────────────────────────────────────────────
function goTo(page) {
  PAGE = page;
  document.querySelectorAll('.nav-item').forEach(function(n){ n.classList.remove('active'); });
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
  var ni = document.getElementById('ni-'+page);
  if(ni) ni.classList.add('active');
  var pg = document.getElementById('page-'+page);
  if(pg) pg.classList.add('active');
  renderPage(page);
  if(window.innerWidth<=768) closeSB();
}

function buildNav(role) {
  var nav = document.getElementById('sb-nav');
  if(!nav) return;
  nav.innerHTML = '';
  (NAV[role]||NAV.client).forEach(function(it){
    var d = document.createElement('div');
    d.className = 'nav-item' + (PAGE===it.id?' active':'');
    d.id = 'ni-'+it.id;
    d.textContent = it.i + ' ' + t(it.id);
    (function(id){ d.onclick = function(){ goTo(id); }; })(it.id);
    nav.appendChild(d);
  });
}

function toggleSB() {
  var sb = document.getElementById('sidebar');
  var ov = document.getElementById('overlay');
  if(!sb) return;
  if(sb.classList.contains('open')) { sb.classList.remove('open'); ov.classList.remove('show'); }
  else { sb.classList.add('open'); ov.classList.add('show'); }
}
function closeSB() {
  var sb = document.getElementById('sidebar');
  var ov = document.getElementById('overlay');
  if(sb) sb.classList.remove('open');
  if(ov) ov.classList.remove('show');
}

function toggleRec(id) {

function selectReason(r, idx) {
  skipReason = r;
  document.querySelectorAll('[id^="sr-"]').forEach(function(b){ b.style.borderColor='var(--bd)'; b.style.background='transparent'; b.style.color='var(--tx2)'; });

  if(cb){ cb.style.opacity='1'; cb.style.pointerEvents='auto'; }
}

function selectSkipDays(d) {
  skipDays = d;
  document.querySelectorAll('[id^="sd-"]').forEach(function(b){ b.style.borderColor='var(--bd)'; b.style.background='transparent'; b.style.color='var(--tx2)'; });

  closeSkipModal();
  for(var i=0;i<Math.min(skipDays, CLIENTS.length && CLIENTS[0].plan.length);i++){
    CLIENTS[0].plan[i] = {d:CLIENTS[0].plan[i].d,t:'rest',title:LANG==='es'?'Descanso':'Rest / Recovery',det:(LANG==='es'?'Descanso por: ':'Rest due to: ')+skipReason,note:LANG==='es'?'Plan ajustado':'Plan adjusted by coach'};

}

function rTraining() {
  var c = CLIENTS[0];
  var today = new Date();

  function buildRunningRoutine(routine) {

        (blk.pace?'<span style="font-size:.68rem;background:rgba(55,138,221,.12);color:var(--blu);border:1px solid rgba(55,138,221,.3);padding:.15rem .45rem;border-radius:20px;flex-shrink:0">'+blk.pace+'</span>':'') +
        '</div>' +
        (blk.desc?'<div style="font-size:.82rem;color:var(--tx2);line-height:1.55;margin-bottom:.35rem">'+blk.desc+'</div>':'') +
        (drill&&drill.vid?'<div style="border-radius:8px;overflow:hidden;margin-top:.35rem"><iframe width="100%" height="145" src="https://www.youtube.com/embed/'+drill.vid+'?controls=1&rel=0&modestbranding=1" frameborder="0" allowfullscreen style="display:block"></iframe></div>'+(drill.tip?'<div style="font-size:.68rem;color:var(--tx3);margin-top:.2rem;font-style:italic">💡 '+drill.tip+'</div>':''):'') +

      circuits.forEach(function(circ, ci) {
        html += '<div style="background:rgba(55,138,221,.05);border:1px solid rgba(55,138,221,.2);border-radius:10px;padding:.85rem;margin-bottom:.65rem">' +

          '<span style="background:var(--blu);color:#fff;border-radius:5px;padding:.2rem .55rem;font-size:.68rem;font-weight:700">⚡ '+(LANG==='es'?'CIRCUITO':'CIRCUIT')+' '+(ci+1)+(circ.name?' — '+circ.name:'')+'</span>' +
          '<span style="font-size:.72rem;color:var(--tx2)">'+(circ.rounds||3)+' '+(LANG==='es'?'rondas':'rounds')+'</span>' +

              '<div style="display:flex;align-items:center;gap:.65rem;flex-wrap:wrap">' +
              '<span style="font-size:.85rem;font-weight:500;flex:1;min-width:100px">'+(ei+1)+'. '+(ex.exercise||'—')+'</span>' +
              '<span style="font-size:.75rem;color:var(--gold);font-weight:600;white-space:nowrap">'+(ex.sets||3)+'×'+(ex.reps||12)+(ex.load?' · '+ex.load:'')+'</span>' +

              (found&&found.tip?'<div style="font-size:.68rem;color:var(--tx3);margin-top:.2rem;font-style:italic">💡 '+found.tip+'</div>':'') +

          '</div>';

          (ex.rest?'<span style="font-size:.68rem;color:var(--tx3)">rest: '+ex.rest+'</span>':'') +

          '</div>';
      });

    return html;
  }

  var rows = c.plan.map(function(s, i) {
    var d = new Date(mon);
    d.setDate(mon.getDate() + i);

        '<div style="flex:1;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:.75rem;text-align:center;color:var(--tx3);font-size:.88rem;font-style:italic">😴 '+(s.title||'Rest')+(s.note?'<div style="font-size:.72rem;color:var(--gold);margin-top:.25rem">💬 '+s.note+'</div>':'')+'</div>' +
        '</div></div>';
    }

    // Build full session detail
    var hasRoutine = (s.routine&&s.routine.length>0)||(s.circuits&&s.circuits.length>0);

    if(s.t==='run') routineHtml = buildRunningRoutine(s.routine);

        '<div style="font-size:.68rem;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:.6rem">'+(s.t==='run'?(LANG==='es'?'Rutina de Carrera':'Running Routine'):(LANG==='es'?'Ejercicios':'Exercises'))+'</div>' +
        routineHtml +
        '</div>'
      :'<div style="padding:.5rem 1rem"><div style="font-size:.78rem;color:var(--tx3);font-style:italic">'+(LANG==='es'?'Sin rutina detallada asignada aun':'No detailed routine assigned yet')+'</div></div>') +
      // Log session footer
      '<div style="padding:.65rem 1rem;border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap">' +

  }).join('');

  h('training',

  function buildRunRows(routine) {

    routine.forEach(function(blk) {
      var drill = RUNNING_DRILLS.find(function(d){return d.name===blk.type||blk.type.indexOf(d.name)>=0;});
      var videoUrl = drill ? ytUrl(drill.vid) : '';
      html += '<div style="padding:8px 0;border-bottom:1px solid #f5f5f5">' +
        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">' +

        (blk.duration?'<span style="font-size:.75rem;color:#C9A84C;font-weight:600">⏱ '+blk.duration+'</span>':'') +
        (blk.distance?'<span style="font-size:.75rem;color:#1a73e8">📍 '+blk.distance+'</span>':'') +
        (blk.pace?'<span style="font-size:.68rem;background:#e8f4fd;color:#1a73e8;padding:2px 8px;border-radius:10px">'+blk.pace+'</span>':'') +
        (blk.hrzone?'<span style="font-size:.68rem;background:#e8f8f1;color:#1D9E75;padding:2px 8px;border-radius:10px">'+blk.hrzone+'</span>':'') +
        '</div>' +

  function buildGymRows(routine, circuits) {
    var html = '';
    if(circuits&&circuits.length) {
      circuits.forEach(function(circ,ci) {
        html += '<div style="background:#f0f7ff;border:1px solid #b3d9f7;border-radius:8px;padding:10px;margin:8px 0">' +
          '<div style="font-size:.72rem;font-weight:700;color:#1a73e8;margin-bottom:6px">⚡ '+(LANG==='es'?'CIRCUITO':'CIRCUIT')+' '+(ci+1)+(circ.name?' — '+circ.name:'')+' · '+(circ.rounds||3)+' '+(LANG==='es'?'rondas':'rounds')+'</div>' +
          (circ.exercises||[]).map(function(ex,ei) {
            var allEx=[].concat(EXERCISE_LIB.legs,EXERCISE_LIB.upper,EXERCISE_LIB.core,EXERCISE_LIB.mobility);

              '<div style="display:flex;align-items:center;gap:8px">' +
              '<span style="font-size:.85rem;font-weight:500;flex:1">'+(ei+1)+'. '+(ex.exercise||'—')+'</span>' +
              '<span style="font-size:.75rem;color:#C9A84C;font-weight:600">'+(ex.sets||3)+'×'+(ex.reps||12)+(ex.load?' · '+ex.load:'')+'</span>' +
              '</div>' +
              (vUrl?'<div class="video-link-row" style="margin-top:4px"><span class="video-label">'+ex.exercise+'</span><a href="'+vUrl+'" class="video-url">'+vUrl+'</a><img class="qr-code" src="'+qrUrl(vUrl)+'" alt="QR"></div>':'') +
              (found&&found.tip?'<div style="font-size:.68rem;color:#888;font-style:italic">💡 '+found.tip+'</div>':'') +
              '</div>';
          }).join('') +
          (circ.notes?'<div style="font-size:.75rem;color:#C9A84C;margin-top:5px">💬 '+circ.notes+'</div>':'') +
          '</div>';
      });
    }
    if(routine&&routine.length) {
      routine.forEach(function(ex) {
        var allEx=[].concat(EXERCISE_LIB.legs,EXERCISE_LIB.upper,EXERCISE_LIB.core,EXERCISE_LIB.mobility);
        var found=allEx.find(function(e){return e.name===ex.exercise;});
        var vUrl = found?ytUrl(found.vid):'';
        html += '<div style="padding:7px 0;border-bottom:1px solid #f0f0f0">' +
          '<div style="display:flex;align-items:center;gap:8px">' +
          '<span style="font-size:.85rem;font-weight:500;flex:1">'+(ex.exercise||'—')+'</span>' +
          '<span style="font-size:.75rem;color:#C9A84C;font-weight:600">'+(ex.sets||3)+'×'+(ex.reps||12)+(ex.load?' · '+ex.load:'')+'</span>' +
          '</div>' +
          (vUrl?'<div class="video-link-row" style="margin-top:4px"><span class="video-label">'+ex.exercise+'</span><a href="'+vUrl+'" class="video-url">'+vUrl+'</a><img class="qr-code" src="'+qrUrl(vUrl)+'" alt="QR"></div>':'') +
          '</div>';
      });
    }
    return html;
  }

  var sessionBody = '';
  if(s.t==='run') sessionBody = buildRunRows(s.routine);

    (s.note?'<div style="background:#fffbf0;border-left:3px solid #C9A84C;padding:8px 12px;border-radius:0 6px 6px 0;font-size:.82rem;color:#555;margin-bottom:12px">💬 <strong>'+(LANG==='es'?'Nota del Coach:':'Coach Note:')+'</strong> '+s.note+'</div>':'') +

    '</body></html>';

  openPrintWindow(html, dayName.toLowerCase()+'-'+s.title.replace(/\s+/g,'-').toLowerCase());
}

function editSession(idx) {
  var c = CURRENT_CLIENT; var s = c.plan[idx];
  if(!s.routine) s.routine=[];
  if(!s.circuits) s.circuits=[];

  var routineEditor = '';

  if(s.t === 'run') {
    var blockTypes = ['Warm-up','Easy Run','Long Run','Recovery Run','Tempo Run','Marathon Pace','Intervals','Fartlek','Hills','Progressive Run','Race Simulation','Track Session','Strength Drills','Mobility','A-Skip','B-Skip','High Knees','Butt Kicks','Carioca','Bounding','Strides','Cool-down','Cross-training','Rest'];
    routineEditor = '<div style="font-weight:700;color:var(--gold);font-size:.88rem;letter-spacing:1px;text-transform:uppercase;margin:1rem 0 .65rem;padding-bottom:.35rem;border-bottom:1px solid var(--bd)">' +
      (LANG==='es'?'Bloques de la Sesion':'Session Blocks') + '</div>' +
      '<div class="nb blue" style="font-size:.75rem">'+(LANG==='es'?'Agrega bloques para estructurar el entrenamiento. Cada bloque puede tener ritmo objetivo, zona FC, distancia y video.':'Add blocks to structure the session. Each block can have target pace, HR zone, distance and video link.')+'</div>';

    s.routine.forEach(function(b, bi) {
      var drill = RUNNING_DRILLS.find(function(d){ return d.name===b.type||b.type.indexOf(d.name)>=0; });
      var vidId = drill ? drill.vid : '';
      routineEditor += '<div style="background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:.85rem;margin-bottom:.6rem">' +
        '<div style="display:grid;grid-template-columns:1fr 80px auto;gap:.4rem;margin-bottom:.5rem;align-items:center">' +
        '<select onchange="CURRENT_CLIENT.plan['+idx+'].routine['+bi+'].type=this.value;editSession('+idx+')" style="background:var(--sf3);border:1px solid var(--bd);border-radius:7px;padding:.4rem .6rem;color:var(--tx);font-size:.78rem;outline:none">' +
        blockTypes.map(function(bl){ return '<option'+(b.type===bl?' selected':'')+'>'+bl+'</option>'; }).join('') +
        '</select>' +
        '<input type="text" value="'+(b.duration||'')+'" onchange="CURRENT_CLIENT.plan['+idx+'].routine['+bi+'].duration=this.value" placeholder="20min" style="background:var(--sf3);border:1px solid var(--bd);border-radius:7px;padding:.4rem .6rem;color:var(--tx);font-size:.78rem;outline:none">' +
        '<button onclick="CURRENT_CLIENT.plan['+idx+'].routine.splice('+bi+',1);editSession('+idx+')" style="background:transparent;border:1px solid var(--red);border-radius:5px;padding:.3rem .5rem;color:var(--red);cursor:pointer;font-size:.75rem">✕</button>' +
        '</div>' +
        // Description
        '<input type="text" value="'+(b.desc||'')+'" onchange="CURRENT_CLIENT.plan['+idx+'].routine['+bi+'].desc=this.value" placeholder="'+(LANG==='es'?'Descripcion del bloque...':'Block description...')+'" style="width:100%;background:var(--sf3);border:1px solid var(--bd);border-radius:7px;padding:.4rem .6rem;color:var(--tx);font-size:.78rem;outline:none;margin-bottom:.4rem">' +
        // Pace + HR Zone + Distance row
        '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:.4rem;margin-bottom:.4rem">' +
        '<div><label style="font-size:.6rem;color:var(--tx3);display:block;margin-bottom:.2rem;text-transform:uppercase">'+( LANG==='es'?'Ritmo objetivo':'Target pace')+'</label><input type="text" value="'+(b.pace||'')+'" onchange="CURRENT_CLIENT.plan['+idx+'].routine['+bi+'].pace=this.value" placeholder="5:30/km" style="width:100%;background:var(--sf3);border:1px solid var(--bd);border-radius:7px;padding:.38rem .5rem;color:var(--tx);font-size:.78rem;outline:none"></div>' +
        '<div><label style="font-size:.6rem;color:var(--tx3);display:block;margin-bottom:.2rem;text-transform:uppercase">'+( LANG==='es'?'Zona FC':'HR Zone')+'</label><select onchange="CURRENT_CLIENT.plan['+idx+'].routine['+bi+'].hrzone=this.value" style="width:100%;background:var(--sf3);border:1px solid var(--bd);border-radius:7px;padding:.38rem .5rem;color:var(--tx);font-size:.78rem;outline:none"><option value="">—</option><option'+(b.hrzone==='Z1'?' selected':'')+'>Z1</option><option'+(b.hrzone==='Z2'?' selected':'')+'>Z2</option><option'+(b.hrzone==='Z3'?' selected':'')+'>Z3</option><option'+(b.hrzone==='Z4'?' selected':'')+'>Z4</option><option'+(b.hrzone==='Z5'?' selected':'')+'>Z5</option></select></div>' +
        '<div><label style="font-size:.6rem;color:var(--tx3);display:block;margin-bottom:.2rem;text-transform:uppercase">'+( LANG==='es'?'Distancia':'Distance')+'</label><input type="text" value="'+(b.distance||'')+'" onchange="CURRENT_CLIENT.plan['+idx+'].routine['+bi+'].distance=this.value" placeholder="5km" style="width:100%;background:var(--sf3);border:1px solid var(--bd);border-radius:7px;padding:.38rem .5rem;color:var(--tx);font-size:.78rem;outline:none"></div>' +

    // Render circuits
    if(!s.circuits) s.circuits=[];
    s.circuits.forEach(function(circ, ci) {
      routineEditor += '<div style="background:rgba(55,138,221,.06);border:1px solid rgba(55,138,221,.3);border-radius:12px;padding:1rem;margin-bottom:.85rem">' +
        // Circuit header

function updateExercise(planIdx, routineIdx, exerciseName) {
  CURRENT_CLIENT.plan[planIdx].routine[routineIdx].exercise = exerciseName;
  editSession(planIdx);
}


function saveSession(idx) {
  var c = CURRENT_CLIENT;
  c.plan[idx].title = document.getElementById('es-t').value;
  c.plan[idx].t = document.getElementById('es-tp').value;
  c.plan[idx].det = document.getElementById('es-d').value;
  c.plan[idx].note = document.getElementById('es-n').value;
  CLIENT_TAB = 'plan'; toast('ok'); rClientDetail();
}

function toggleAcc(dtype, role) {
  if(!CURRENT_CLIENT||role==='admin') return;
  if(!CURRENT_CLIENT.access) CURRENT_CLIENT.access={};
  if(!CURRENT_CLIENT.access[dtype]) CURRENT_CLIENT.access[dtype]=['admin'];
  var arr=CURRENT_CLIENT.access[dtype]; var idx=arr.indexOf(role);
  if(idx>=0) arr.splice(idx,1); else arr.push(role);
  rClientDetail();
}

  var coach = COACHES.find(function(c){return c.id===coachId;});

function calcZones() {
  var rhr = parseInt(document.getElementById('rhr').value);
  var mhr = parseInt(document.getElementById('mhr').value);
  var d = document.getElementById('zones-display');
  if(rhr && mhr && d) {
    var z1=Math.round(rhr+(mhr-rhr)*.5), z2=Math.round(rhr+(mhr-rhr)*.6), z3=Math.round(rhr+(mhr-rhr)*.7), z4=Math.round(rhr+(mhr-rhr)*.8), z5=Math.round(rhr+(mhr-rhr)*.9);
    d.innerHTML = '<div class="nb blue" style="font-size:.75rem"><strong>'+(LANG==='es'?'Zonas de FC:':'HR Zones:')+'</strong> Z1: '+z1+' - Z2: '+z2+' - Z3: '+z3+' - Z4: '+z4+' - Z5: '+z5+' bpm</div>';
  }
}

function exportTrainingPDF(clientObj) {
  var c = clientObj || CLIENTS[0];
  if(!c) { toast(LANG==='es'?'No hay cliente seleccionado':'No client selected'); return; }

  var days_en = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  var days_es = ['Lunes','Martes','Miercoles','Jueves','Viernes','Sabado','Domingo'];
  var days = LANG==='es' ? days_es : days_en;

  var planRows = c.plan.map(function(s, i) {
    if(s.t === 'rest') {
      return '<div class="day-block"><div class="day-header"><span class="day-label">' + days[i] + '</span><span class="day-type">' + (LANG==='es'?'Descanso':'Rest') + '</span></div><div class="rest-day">😴 ' + s.title + '</div></div>';
    }

    var routineHtml = '';
    var videoSection = '';
    var videos = [];

    if(s.routine && s.routine.length > 0) {
      if(s.t === 'run') {
        routineHtml = '<div class="routine-title">' + (LANG==='es'?'Rutina de Carrera':'Running Routine') + '</div>';
        s.routine.forEach(function(blk) {
          routineHtml += '<div class="block-row"><span class="block-tag">' + blk.type + '</span><span class="block-desc">' + (blk.desc||'') + '</span><span class="block-dur">' + (blk.duration||'') + '</span></div>';
          // Find video for this drill type
          var drill = RUNNING_DRILLS.find(function(d){ return d.name===blk.type || blk.type.indexOf(d.name)>=0; });
          if(drill && drill.vid) {
            videos.push({label: blk.type, url: ytUrl(drill.vid), qr: qrUrl(ytUrl(drill.vid)), tip: drill.tip});
          }
        });
      } else if(s.t === 'gym') {
        routineHtml = '<div class="routine-title">' + (LANG==='es'?'Ejercicios':'Exercises') + '</div>';
        routineHtml += '<div class="ex-row" style="font-size:.65rem;font-weight:700;color:#999;text-transform:uppercase"><span>' + (LANG==='es'?'Ejercicio':'Exercise') + '</span><span style="text-align:center">Sets</span><span style="text-align:center">Reps</span><span>' + (LANG==='es'?'Carga':'Load') + '</span></div>';
        s.routine.forEach(function(ex) {
          if(ex.grouped) routineHtml += '<div class="circuit-badge">⚡ Circuit</div>';
          routineHtml += '<div class="ex-row"><span class="ex-name">' + (ex.exercise||'') + '</span><span class="ex-sets">' + (ex.sets||'') + '</span><span class="ex-reps">' + (ex.reps||'') + '</span><span class="ex-load">' + (ex.load||'') + (ex.rest?' · '+ex.rest:'') + '</span></div>';
          // Find video for this exercise
          var allEx = [].concat(EXERCISE_LIB.legs, EXERCISE_LIB.upper, EXERCISE_LIB.core, EXERCISE_LIB.mobility);
          var found = allEx.find(function(e){ return e.name===ex.exercise; });
          if(found && found.vid && !videos.find(function(v){return v.label===ex.exercise;})) {
            videos.push({label: ex.exercise, url: ytUrl(found.vid), qr: qrUrl(ytUrl(found.vid)), tip: found.tip});
          }
        });
      }
    }

    // Build video section with QR codes
    if(videos.length > 0) {
      videoSection = '<div class="video-section"><div style="font-size:.65rem;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">📹 ' + (LANG==='es'?'Videos de Tecnica':'Technique Videos') + '</div>';
      videos.forEach(function(v) {
        videoSection += '<div class="video-link-row"><span class="video-label">' + v.label + '</span><a href="' + v.url + '" class="video-url">' + v.url + '</a><img class="qr-code" src="' + v.qr + '" alt="QR"></div>';
        if(v.tip) videoSection += '<div style="font-size:.68rem;color:#888;margin-bottom:4px;margin-left:90px;font-style:italic">💡 ' + v.tip + '</div>';
      });
      videoSection += '</div>';
    }

    return '<div class="day-block"><div class="day-header"><span class="day-label">' + days[i] + '</span><span class="day-type">' + s.title + '</span></div>' +
      '<div class="session-card"><div class="session-title">' + s.title + '</div>' +
      '<div class="session-det">' + s.det + '</div>' +
      (s.note ? '<div class="session-note">💬 ' + s.note + '</div>' : '') +
      routineHtml + videoSection +
      '</div></div>';
  }).join('');

  var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Training Plan - ' + c.name + '</title>' + buildPDFStyles() + '</head><body>' +
    '<div class="pdf-header"><div class="pdf-logo">FinisherFlow</div><div class="pdf-meta"><div style="font-weight:600">' + c.name + '</div><div>' + (LANG==='es'?'Plan de Entrenamiento':'Training Plan') + ' — ' + new Date().toLocaleDateString() + '</div><div style="margin-top:2px">' + c.goal + '</div></div></div>' +
    '<div class="pdf-title">' + (LANG==='es'?'Plan Semanal de Entrenamiento':'Weekly Training Plan') + '</div>' +
    '<div class="pdf-sub">' + c.name + ' · ' + c.level + ' · ' + c.km + 'km/wk · ' + (LANG==='es'?'Objetivo:':'Goal:') + ' ' + c.target + '</div>' +
    planRows +
    '<div class="footer"><div class="footer-logo">FinisherFlow</div><div class="footer-note">' + (LANG==='es'?'Escaneá los codigos QR para ver los videos de tecnica':'Scan QR codes to watch technique videos') + ' · FinisherFlow.com</div></div>' +
    '</body></html>';

  openPrintWindow(html, 'training-plan-' + c.name.replace(/\s+/g,'-').toLowerCase());
}

function exportCoursePDF(courseId) {
  var c = COURSES_DATA.find(function(x){ return x.id===parseInt(courseId); });
  if(!c) return;

  var lessonsHtml = c.lessons.map(function(l, i) {
    var isLocked = !l.free;
    var vidHtml = '';
    if(l.video_url) {
      var url = l.video_url.indexOf('embed') >= 0 ? l.video_url.replace('embed/','watch?v=').replace('?autoplay=0&controls=1&rel=0&modestbranding=1','') : l.video_url;
      vidHtml = '<div class="video-section"><div class="video-link-row"><span class="video-label">Video</span><a href="' + url + '" class="video-url">' + url + '</a><img class="qr-code" src="' + qrUrl(url) + '" alt="QR"></div></div>';
    }
    return '<div class="day-block">' +
      '<div class="day-header">' +
      '<span class="day-label">' + (LANG==='es'?'Leccion':'Lesson') + ' ' + (i+1) + '</span>' +
      (l.free ? '<span class="day-type" style="color:green;border-color:green">' + (LANG==='es'?'Gratis':'Free') + '</span>' : '<span class="day-type">🔒 ' + (LANG==='es'?'Premium':'Premium') + '</span>') +
      (l.duration ? '<span class="day-type">⏱ '+l.duration+'</span>' : '') +
      '</div>' +
      '<div class="session-card"><div class="session-title">' + l.title + '</div>' +
      (l.content ? '<div style="font-size:.85rem;color:#444;line-height:1.7;margin:8px 0">' + l.content + '</div>' : '') +
      vidHtml + '</div></div>';
  }).join('');

  var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + c.title + '</title>' + buildPDFStyles() + '</head><body>' +
    '<div class="pdf-header"><div class="pdf-logo">FinisherFlow</div><div class="pdf-meta"><div style="font-weight:600">' + c.title + '</div><div>' + (LANG==='es'?'Estructura del Curso':'Course Structure') + '</div><div>USD ' + c.price + '</div></div></div>' +
    '<div class="pdf-title">' + c.emoji + ' ' + c.title + '</div>' +
    '<div class="pdf-sub">' + c.desc + '</div>' +
    lessonsHtml +
    '<div class="footer"><div class="footer-logo">FinisherFlow</div><div class="footer-note">' + (LANG==='es'?'Escaneá los QR para acceder a los videos de cada leccion':'Scan QR codes to access lesson videos') + ' · FinisherFlow.com</div></div>' +
    '</body></html>';

  openPrintWindow(html, 'course-' + c.title.replace(/\s+/g,'-').toLowerCase());
}

function openPrintWindow(html, filename) {
  var win = window.open('', '_blank');
  if(!win) { toast(LANG==='es'?'Permite ventanas emergentes para descargar el PDF':'Allow popups to download PDF'); return; }
  win.document.write(html);
  win.document.close();
  win.focus();
  setTimeout(function(){
    win.print();
  }, 800);
  toast(LANG==='es'?'PDF listo — usá Guardar como PDF en el dialogo de impresion':'PDF ready — use Save as PDF in the print dialog');
}

window.addEventListener('load', function() {
  setTimeout(function(){
    document.getElementById('splash').classList.add('gone');
  }, 1200);

  setTimeout(function(){
    if(!SB) { showAuth(); return; }
    SB.auth.getSession().then(function(res){
      var session = res.data && res.data.session;
      if(session) {
        USER = session.user;
        loadProfile().then(function(){
          if(PROFILE.role==='client') {
            showDisc();
          } else {
            showApp();
          }
        });
      } else {
        showAuth();
      }
    }).catch(function(){ showAuth(); });
  }, 1400);

  SB && SB.auth.onAuthStateChange(function(event, session){
    if(event==='SIGNED_IN' && session && !USER) {
      USER = session.user;
      loadProfile().then(function(){
        if(PROFILE.role==='client') {
          showDisc();
        } else {
          showApp();
        }
      });
    }
  });
});
</script>
