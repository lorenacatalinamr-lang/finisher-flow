.lbtn.off{background:transparent;color:var(--tx2)}
.auth-title{font-size:1.1rem;font-weight:600;text-align:center;margin-bottom:1.25rem}
.fld{margin-bottom:.9rem}
.fld label{display:block;font-size:.68rem;color:var(--tx2);letter-spacing:.5px;margin-bottom:.35rem;text-transform:uppercase}
.fld input,.fld select{width:100%;background:var(--sf2);border:1px solid var(--bd);border-radius:9px;padding:.7rem .9rem;color:var(--tx);font-size:.95rem;outline:none;-webkit-appearance:none;transition:.2s}
.fld input:focus,.fld select:focus{border-color:var(--gold)}
.fld select option{background:var(--sf2)}
.btn-gold{width:100%;padding:.85rem;background:var(--gold);border:none;border-radius:10px;color:#0C0C0F;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:.75rem;transition:.2s}
.btn-gold:active{background:var(--g2)}
.auth-sw{text-align:center;font-size:.85rem;color:var(--tx2);margin-bottom:.75rem}
.auth-sw span{color:var(--gold);cursor:pointer;text-decoration:underline}
.auth-div{text-align:center;color:var(--tx3);font-size:.78rem;margin:.65rem 0;position:relative}

.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.dbtn{padding:.75rem;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;text-align:center;border:none;transition:.2s}
.dbtn.admin{background:rgba(201,168,76,.15);border:2px solid var(--gold);color:var(--gold)}
.dbtn.other{background:var(--sf2);border:1px solid var(--bd);color:var(--tx2)}
.trial-box{background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.2);border-radius:8px;padding:.65rem;font-size:.78rem;color:var(--gold);text-align:center;margin-bottom:1rem}
.err-box{background:rgba(226,75,74,.1);border:1px solid rgba(226,75,74,.3);border-radius:8px;padding:.65rem .85rem;font-size:.82rem;color:#f08080;margin-bottom:.85rem;display:none}
.err-box.show{display:block}
/* DISCLAIMER */
.disc-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.disc-box{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:2rem;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.disc-box h2{font-size:1.6rem;font-weight:900;color:var(--red);text-align:center;margin-bottom:.5rem}
.disc-box h3{font-size:.88rem;font-weight:600;color:var(--gold);margin:1rem 0 .35rem}
.disc-box p,.disc-box li{font-size:.82rem;color:var(--tx2);line-height:1.7}
.disc-box ul{padding-left:1.2rem;margin-bottom:.5rem}
.disc-accept{display:flex;align-items:flex-start;gap:.75rem;background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:1rem;margin-top:1.25rem;cursor:pointer;transition:.2s}
.disc-accept.checked{border-color:var(--gold)}
.disc-accept input{margin-top:3px;flex-shrink:0;accent-color:var(--gold)}
.disc-accept span{font-size:.82rem;line-height:1.5}

.sidebar{width:225px;background:var(--sf);border-right:1px solid var(--bd);position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:100;transition:transform .3s;overflow-y:auto}
.sb-logo{padding:1.25rem;border-bottom:1px solid var(--bd)}

.sb-logo p{font-size:.62rem;color:var(--tx3);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}

.sb-av{width:32px;height:32px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.72rem;color:#0C0C0F;flex-shrink:0}
.sb-info p{font-size:.82rem;font-weight:500}

.sb-bottom{padding:.75rem 1.25rem;border-top:1px solid var(--bd)}

.logout-btn{width:100%;padding:.5rem;background:transparent;border:1px solid var(--bd);border-radius:8px;color:var(--tx2);font-size:.82rem;cursor:pointer;transition:.2s}

.page{display:none}.page.active{display:block}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90}
.overlay.show{display:block}

.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:1.25rem}

.ph p{color:var(--tx2);font-size:.85rem;margin-bottom:1.5rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}

.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.65rem}

.wkbtn:hover{border-color:var(--gold);color:var(--gold)}
.day-row{display:grid;grid-template-columns:48px 1fr;gap:.65rem;margin-bottom:.5rem;align-items:start}
.dlbl{font-size:.72rem;color:var(--tx2);padding-top:.35rem;text-align:right}

.edit-btn:hover{border-color:var(--gold);color:var(--gold)}
.stitle{font-size:1rem;font-weight:700;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;margin:1.25rem 0 .75rem;padding-bottom:.4rem;border-bottom:1px solid var(--bd)}
.stitle:first-child{margin-top:0}
.acc-chip{padding:.2rem .6rem;border-radius:20px;font-size:.7rem;cursor:pointer;border:1px solid var(--bd);background:transparent;color:var(--tx3);transition:.15s}
.acc-chip.on{background:rgba(201,168,76,.12);border-color:var(--gold);color:var(--gold)}
.tabs{display:flex;gap:3px;background:var(--sf2);padding:3px;border-radius:9px;margin-bottom:1.25rem;flex-wrap:wrap;width:fit-content}
.tab{padding:.42rem 1rem;border:none;background:transparent;color:var(--tx2);cursor:pointer;border-radius:7px;font-size:.82rem;transition:.15s}
.tab.active{background:var(--sf);color:var(--tx)}
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--sf);border:1px solid var(--gold);border-radius:10px;padding:.7rem 1.25rem;color:var(--tx);font-size:.85rem;z-index:9999;opacity:0;transform:translateY(16px);transition:.3s;pointer-events:none;max-width:260px;text-align:center}
.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main-content{margin-left:0;padding:1rem;padding-top:4rem}
  .hamburger{display:flex;align-items:center}
  .g2,.g3{grid-template-columns:1fr}
  .g4{grid-template-columns:1fr 1fr}
  .day-row{grid-template-columns:42px 1fr}
}
@media(min-width:769px){.sidebar{transform:translateX(0)}}
</style>

  if(fr) fr.style.display = '';
}

async function doLogin() {
  var email = document.getElementById('l-email').value.trim();
  var pass = document.getElementById('l-pass').value;
  if(!email||!pass){ showErr('Please fill in all fields'); return; }
  var btn = document.getElementById('lang-signinbtn');
  btn.disabled = true; btn.textContent = '...';
  try {
    var res = await SB.auth.signInWithPassword({email:email, password:pass});
    if(res.error) { showErr(res.error.message); }
  } catch(e) { showErr('Login failed. Please try again.'); }
  btn.disabled = false; btn.textContent = t('signinbtn');
}

async function doRegister() {
  var name = document.getElementById('r-name').value.trim();
  var email = document.getElementById('r-email').value.trim();
  var pass = document.getElementById('r-pass').value;
  var role = document.getElementById('r-role').value;
  if(!name||!email||!pass){ showErr('Please fill in all fields'); return; }
  var btn = document.getElementById('lang-regbtn');
  btn.disabled = true; btn.textContent = '...';
  try {
    var res = await SB.auth.signUp({email:email, password:pass, options:{data:{full_name:name, role:role}}});
    if(res.error) { showErr(res.error.message); }
    else {
      toast('Welcome to Finisher Flow!');
      await SB.auth.signInWithPassword({email:email, password:pass});
    }
  } catch(e) { showErr('Registration failed. Please try again.'); }
  btn.disabled = false; btn.textContent = t('regbtn');
}

function demoLogin(role) {
  USER = {id:'demo-'+role};
  PROFILE = {id:'demo-'+role, full_name:role==='admin'?'Lorena Mela':'Christian C.', name:role==='admin'?'Lorena Mela':'Christian C.', role:role, email:role+'@finisherflow.com'};
  document.getElementById('screen').innerHTML = '';

}

function enterApp() {
  if(!DISC_CHECKED){ toast('Please accept the health disclaimer first'); return; }
  document.getElementById('screen').innerHTML = '';
  showApp();
}

async function doLogout() {
  try { if(SB) await SB.auth.signOut(); } catch(e){}
  USER = null; PROFILE = null;
  document.getElementById('hamburger').style.display = 'none';
  closeSB();
  showAuth();
}

async function loadProfile() {
  try {
    var res = await SB.from('profiles').select('*').eq('id', USER.id).single();
    if(res.data) { PROFILE = res.data; return; }
    var meta = USER.user_metadata || {};
    var p = {id:USER.id, full_name:meta.full_name||USER.email, name:meta.full_name||USER.email, email:USER.email, role:meta.role||'client'};
    await SB.from('profiles').upsert(p);
    PROFILE = p;
  } catch(e) {
    var meta = USER.user_metadata || {};
    PROFILE = {id:USER.id, full_name:meta.full_name||USER.email, name:meta.full_name||USER.email, email:USER.email, role:meta.role||'client'};
  }
}

// ── NAVIGATION ─────────────────────────────────────────────────────────────
function goTo(page) {
  PAGE = page;
  document.querySelectorAll('.nav-item').forEach(function(n){ n.classList.remove('active'); });
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
  var ni = document.getElementById('ni-'+page);
  if(ni) ni.classList.add('active');
  var pg = document.getElementById('page-'+page);
  if(pg) pg.classList.add('active');
  renderPage(page);
  if(window.innerWidth<=768) closeSB();
}

function buildNav(role) {
  var nav = document.getElementById('sb-nav');
  if(!nav) return;
  nav.innerHTML = '';
  (NAV[role]||NAV.client).forEach(function(it){
    var d = document.createElement('div');
    d.className = 'nav-item' + (PAGE===it.id?' active':'');
    d.id = 'ni-'+it.id;
    d.textContent = it.i + ' ' + t(it.id);
    (function(id){ d.onclick = function(){ goTo(id); }; })(it.id);
    nav.appendChild(d);
  });
}

function toggleSB() {
  var sb = document.getElementById('sidebar');
  var ov = document.getElementById('overlay');
  if(!sb) return;
  if(sb.classList.contains('open')) { sb.classList.remove('open'); ov.classList.remove('show'); }
  else { sb.classList.add('open'); ov.classList.add('show'); }
}
function closeSB() {
  var sb = document.getElementById('sidebar');
  var ov = document.getElementById('overlay');
  if(sb) sb.classList.remove('open');
  if(ov) ov.classList.remove('show');
}

window.addEventListener('load', function() {
  setTimeout(function(){
    document.getElementById('splash').classList.add('gone');
  }, 1200);

  setTimeout(function(){
    if(!SB) { showAuth(); return; }
    SB.auth.getSession().then(function(res){
      var session = res.data && res.data.session;
      if(session) {
        USER = session.user;
        loadProfile().then(function(){
          if(PROFILE.role==='client') {
            showDisc();
          } else {
            showApp();
          }
        });
      } else {
        showAuth();
      }
    }).catch(function(){ showAuth(); });
  }, 1400);

  SB && SB.auth.onAuthStateChange(function(event, session){
    if(event==='SIGNED_IN' && session && !USER) {
      USER = session.user;
      loadProfile().then(function(){
        if(PROFILE.role==='client') {
          showDisc();
        } else {
          showApp();
        }
      });
    }
  });
});
</script>
</body>
</html>
